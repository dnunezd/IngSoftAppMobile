name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Una ejecución por rama: si llega un commit nuevo, se cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Validar el wrapper de Gradle
        uses: gradle/actions/wrapper-validation@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle (caché)
        uses: gradle/actions/setup-gradle@v4

      # --continue: aunque falle un paso, se generan todos los informes.
      - name: Lint y pruebas unitarias
        run: ./gradlew lint testDebugUnitTest --continue --stacktrace

      - name: Resumen en la ejecución
        if: always()
        run: python3 .github/scripts/resumen_ci.py >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-calidad
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14
